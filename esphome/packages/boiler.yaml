# Lochinvar boiler, read over the controller's built-in Modbus RTU port (19200 8N1, slave 1).
#
# This is the reusable package: the Modbus setup and every entity. It needs a UART with the id
# `boiler_uart`, which one of the transport packages next to it provides (usb-ft232.yaml or
# uart.yaml), and a device config that supplies the board, network and Home Assistant link.
# See ../lochinvar.yaml for a complete device, and ../README.md for using it from GitHub.
#
# READ-ONLY by design: only sensors, binary sensors and text sensors are defined. There are no
# switch, number, select, output or write_* entries, so the ESP never sends a Modbus write.
# tools/check_esphome.py enforces this in CI.
#
# Source of truth for the registers is ../../registers/controller.yaml. Anything marked "guess" or
# "unknown" there is not exposed as an entity here unless noted (kept disabled by default).

esphome:
  project:
    name: kb1rma.lochinvar-native-modbus
    version: "0.1.0" # x-release-please-version

globals:
  # millis() when Status Code last read 6 (prepurge) or 7 (ignition); 0 = not yet. See Failed Ignitions.
  - id: last_ignition_phase_ms
    type: uint32_t
    initial_value: "0"
  # Whether the last read of the ignition counters was taken outside the ignition window.
  - id: counters_clean
    type: bool
    initial_value: "false"
  # Link watchdog (see the interval at the end): armed once a read has succeeded since boot.
  - id: link_seen_ok
    type: bool
    initial_value: "false"
  # millis() when the link went down, 0 while it is up.
  - id: link_down_since
    type: uint32_t
    initial_value: "0"
  - id: watchdog_restarts
    type: uint32_t
    restore_value: true
    initial_value: "0"

modbus:
  id: boiler_modbus
  uart_id: boiler_uart
  send_wait_time: 250ms          # the boiler answered within ~100-250 ms in testing
  turnaround_time: 100ms         # gap after each reply; the default is 600 ms

modbus_controller:
  - id: boiler
    modbus_id: boiler_modbus
    address: 1
    update_interval: 5s          # live readings and status
    max_cmd_retries: 3
    offline_skip_updates: 6      # back off when the boiler stops answering
    # The controller keeps the last values when the boiler stops answering, so on 2026-10-24 Home
    # Assistant showed "Running" for 17 minutes of a dead link. Clear every reading from this group
    # instead; the next good poll publishes real values again. Delta T and Boiler Status follow.
    on_offline:
      - lambda: |-
          for (auto *s : {id(outlet_temp), id(inlet_temp), id(exhaust_temp), id(outdoor_temp),
                          id(outlet_sensor_diff), id(flue_sensor_diff), id(target_temp),
                          id(sh1_reset_target), id(flame_signal), id(fan_speed), id(firing_rate),
                          id(boiler_pump_output), id(status_code), id(raw_r138), id(raw_r139),
                          id(raw_r140)})
            s->publish_state(NAN);
      - binary_sensor.invalidate_state: heat_demand
      - binary_sensor.invalidate_state: burner_request
      - binary_sensor.invalidate_state: anti_cycle
      - binary_sensor.invalidate_state: flame_present
      - lambda: |-
          if (id(link_seen_ok)) id(link_down_since) = std::max<uint32_t>(millis(), 1);
    on_online:
      - lambda: id(link_down_since) = 0;

  # Same boiler, polled less often: settings and lifetime counters.
  - id: boiler_slow
    modbus_id: boiler_modbus
    address: 1
    update_interval: 5min
    max_cmd_retries: 3

# ---------------------------------------------------------------------------------------------
# Temperature decoding (registers/controller.yaml, encoding temp_f):
#   F = ((raw & 0x7FFF) - 9468) / 25, and raw == 0x8000 means no sensor.
#   raw == 0 (-378.7 F) is never a real reading; one came through on the first poll after a reboot
#   on 2026-10-24, so it is dropped too.
# ESPHome hands lambdas the parsed value `x` as a float.
# ---------------------------------------------------------------------------------------------

sensor:
  # ---- fast group (every 5 s) ----
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: outlet_temp
    name: Outlet Temperature
    address: 62
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (x == 32768 || x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: inlet_temp
    name: Inlet Temperature
    address: 73
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (x == 32768 || x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: exhaust_temp
    name: Exhaust Temperature
    address: 63
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (x == 32768 || x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: outdoor_temp
    name: Outdoor Temperature
    address: 75
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      if (x == 32768 || x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  # The control's active set point (WinPro's "dSP"). It reads exactly 32.0 F (raw 43036) when there is
  # no active set point, which in both captures held if and only if Heat Demand was off, so that is
  # published as unknown, not 32. During a call it tracks SH1 Reset Target below.
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: target_temp
    name: Target Temperature
    address: 146
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-check
    reuse_previous_range: true   # read with 137-142 across the unmapped 143-145: one command, not two
    lambda: |-
      if (x == 32768 || x == 0 || x == 43036) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  # SH1 set point after outdoor reset. The control stops updating it with no call for heat, so it is only
  # published while Heat Demand is on (r118, read earlier in the same update; unknown right after the link
  # comes back counts as off).
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: sh1_reset_target
    name: SH1 Reset Target
    address: 142
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    reuse_previous_range: true   # joins the 137-140 read across the unmapped 141
    lambda: |-
      if (x == 32768 || x == 0 || !id(heat_demand).has_state() || !id(heat_demand).state) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  # The outlet and flue sensors are dual thermistors (S1a/S1b at r62/r64, S3a/S3b at r63/r65). The control
  # faults ("Outlet Temp Diff", "Flue sens diff") when a pair disagrees, so a rising difference is an early
  # warning; normal is under 1 F. r64 and r65 come in the same read as r62 and r63, which are parsed first.
  # get_raw_state() is r62/r63 before any filters a device config adds to those sensors.
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: outlet_sensor_diff
    name: Outlet Sensor Difference
    address: 64
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:thermometer-alert
    lambda: |-
      if (x == 32768 || x == 0 || isnan(id(outlet_temp).get_raw_state())) return NAN;
      return fabsf(id(outlet_temp).get_raw_state() - (((int) x & 0x7FFF) - 9468) / 25.0f);

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: flue_sensor_diff
    name: Flue Sensor Difference
    address: 65
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:thermometer-alert
    lambda: |-
      if (x == 32768 || x == 0 || isnan(id(exhaust_temp).get_raw_state())) return NAN;
      return fabsf(id(exhaust_temp).get_raw_state() - (((int) x & 0x7FFF) - 9468) / 25.0f);

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: flame_signal
    name: Flame Signal
    address: 66
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "µA"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: fan_speed
    name: Fan Speed
    address: 110
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: firing_rate
    name: Firing Rate
    address: 80
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.01

  # 100 % from the start of demand until ~60 s after flame-out (post-pump), else 0. The display's
  # "BLR Pump Out" read 99-100 % while this read 100.00.
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: boiler_pump_output
    name: Boiler Pump Output
    address: 132
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: 0.01

  # The boiler display's Delta T is outlet - inlet (r62 - r73); it matched in session 1 allowing for
  # display lag. Computed here from the two readings above, so it costs no extra Modbus reads.
  - platform: template
    name: Delta T
    unit_of_measurement: "°F"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    icon: mdi:thermometer-lines
    lambda: |-
      if (isnan(id(outlet_temp).state) || isnan(id(inlet_temp).state)) return NAN;
      return id(outlet_temp).state - id(inlet_temp).state;

  # ---- slow group: settings (boiler_slow, every 5 min) ----
  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH1 Setpoint
    address: 1287
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH2 Setpoint
    address: 1288
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH3 Setpoint
    address: 1289
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: DHW Setpoint
    address: 1286
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: High Limit Auto Reset
    address: 1291
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: High Limit Manual Reset
    address: 1292
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
    entity_category: diagnostic
    lambda: |-
      if (x == 0) return NAN;
      return (((int) x & 0x7FFF) - 9468) / 25.0f;

  # ---- slow group: lifetime counters (boiler_slow; 32-bit, high word at the lower address) ----
  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: Power On Hours
    address: 1302
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    id: ignition_attempts
    name: Ignition Attempts
    address: 1304
    register_type: holding
    value_type: U_DWORD
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    id: ignitions
    name: Ignitions
    address: 1306
    register_type: holding
    value_type: U_DWORD
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    # The controller counts the attempt during prepurge/ignition and the ignition a few seconds
    # later, once the flame is proven. A read in between makes Failed Ignitions go up by one until
    # the next slow poll (it did at 20:20:41 on 2026-10-24). Mark such reads so it skips them.
    on_value:
      - lambda: |-
          float s = id(status_code).state;
          uint32_t since = millis() - id(last_ignition_phase_ms);
          bool in_ignition = s == 6 || s == 7 || (id(last_ignition_phase_ms) != 0 && since < 30000);
          id(counters_clean) = !isnan(s) && !in_ignition;

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH Run Time
    address: 1308
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  # Map confidence "guess": WinPro's "SH hours <50 %" by order (2055 h against 3828 SH hours).
  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH Run Time Low Fire
    address: 1310
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: boiler_slow
    name: SH Cycles
    address: 1312
    register_type: holding
    value_type: U_DWORD
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  # How often the link watchdog has restarted the ESP (kept across restarts).
  - platform: template
    name: Link Watchdog Restarts
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    icon: mdi:restart-alert
    lambda: return id(watchdog_restarts);

  # Lifetime attempts minus successes (about 109 already). Alert on it increasing, not on its value.
  # Holds its last value when the counters were read during an ignition (see Ignitions above), so
  # it can lag a real failure by one slow poll (5 min), and it stays unknown until the first clean read.
  - platform: template
    name: Failed Ignitions
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      if (!id(counters_clean)) return {};
      if (isnan(id(ignition_attempts).state) || isnan(id(ignitions).state)) return NAN;
      return id(ignition_attempts).state - id(ignitions).state;

  # ---- status (registers/controller.yaml, status section; see docs/reverse-engineering-log.md session 2) ----
  # 4 standby (also during anti-cycle / set point met), 6 prepurge, 7 ignition, 9 running, 10 post-purge.
  # Lockout codes have not been observed yet; Boiler Status shows them as "Unknown (n)".
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: status_code
    name: Status Code
    address: 84
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
      - lambda: |-
          id(link_seen_ok) = true;
          if (x == 6 || x == 7) id(last_ignition_phase_ms) = millis();

  # ---- raw, unidentified status registers (disabled by default; for further reverse engineering) ----

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: raw_r138
    name: Raw State r138
    address: 138
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: raw_r139
    name: Raw State r139
    address: 139
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true

  - platform: modbus_controller
    modbus_controller_id: boiler
    id: raw_r140
    name: Raw State r140
    address: 140
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  # r84 = 4 covers several display states. They are split here the way tools/analysis/backtest.py
  # does, which matched the display notes from session 2: anti-cycle (r137), demand held off
  # (r118 with r140 = 112; the display shows "clocked" or "set point met", which the registers
  # can't tell apart), and pump delay (no demand, r132 still on).
  - platform: template
    name: Boiler Status
    update_interval: 5s
    lambda: |-
      if (id(boiler).get_module_offline()) return {"Link lost"};
      float s = id(status_code).state;
      if (isnan(s)) return {"Unavailable"};
      switch ((int) s) {
        case 4:
          if (id(anti_cycle).state) return {"Anti-cycle"};
          if (id(heat_demand).state && !id(burner_request).state) return {"Demand, held off"};
          if (id(heat_demand).state) return {"Demand"};
          if (id(boiler_pump_output).state > 0) return {"Pump delay"};
          return {"Standby"};
        case 6: return {"Prepurge"};
        case 7: return {"Ignition"};
        case 9: return {"Running"};
        case 10: return {"Post-purge"};
        default: return {"Unknown (" + to_string((int) s) + ")"};
      }

binary_sensor:
  - platform: status
    name: Controller Online

  # r118 = 1 while any zone calls for heat. The boiler cannot tell which zone (DHW is piped as a zone).
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: heat_demand
    name: Heat Demand
    address: 118
    register_type: holding
    bitmask: 0x0001
    icon: mdi:thermostat

  # r140 = 96 when the burner is wanted, 112 when held off (no demand, set point met, clocked).
  # The difference is bit 4, set = held off, so the bit is inverted.
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: burner_request
    name: Burner Request
    address: 140
    register_type: holding
    bitmask: 0x0010
    filters:
      - invert:

  # r137 = 1 from flame-out until the off-delay ends; it cleared with the display leaving anti-cycle.
  - platform: modbus_controller
    modbus_controller_id: boiler
    id: anti_cycle
    name: Anti-Cycle
    address: 137
    register_type: holding
    bitmask: 0x0001
    icon: mdi:timer-sand

  # Flame signal read 0 with the burner off and 2.1 uA within a second of ignition.
  - platform: template
    id: flame_present
    name: Flame Present
    icon: mdi:fire
    lambda: |-
      if (isnan(id(flame_signal).state)) return {};
      return id(flame_signal).state > 0.5f;

  - platform: template
    name: Boiler Link OK
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(boiler).get_module_offline() == false;

# Link watchdog. On 2026-10-24 the link died mid-burn (20:24:33) and stayed dead for 17 minutes, until the
# ESP restarted; on the Mac only a replug helped. Restart the ESP once the link has been down 3 minutes.
# It only arms after a successful read since boot, so a boiler that is off or unplugged does not cause a
# restart loop. Whether a restart is enough (it doesn't cut the cable's 5 V) shows in Boiler Link OK
# after one, and Link Watchdog Restarts counts them.
interval:
  - interval: 30s
    then:
      - lambda: |-
          uint32_t since = id(link_down_since);
          if (since == 0 || millis() - since < 180000) return;
          id(watchdog_restarts) += 1;
          ESP_LOGW("link_watchdog", "Boiler link down for %u s, restarting", (unsigned) ((millis() - since) / 1000));
          App.safe_reboot();
