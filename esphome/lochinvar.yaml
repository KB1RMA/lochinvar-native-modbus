# ESPHome device config for a Lochinvar boiler controller's built-in Modbus RTU port.
#
# The boiler itself lives in packages/boiler.yaml (Modbus setup and every entity, read-only by
# design) and the link in packages/usb-ft232.yaml. This file adds only the board, network and
# Home Assistant link. To build it from a copy of this repository, copy secrets.example.yaml to
# secrets.yaml. To use the packages from GitHub without a copy, see README.md in this folder.
#
# HARDWARE: an ESP32-S3 acts as USB host for the FTDI FT232R inside the boiler, over a plain USB
# cable. Bridge the S3's USB-OTG pad so its USB port supplies 5 V. See packages/usb-ft232.yaml.

substitutions:
  name: lochinvar
  friendly_name: Lochinvar Boiler

packages:
  transport: !include packages/usb-ft232.yaml
  boiler: !include packages/boiler.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Home Assistant discovers the entities through MQTT discovery (enabled by default).
# To use the native HA API instead, remove this block and add `api:`.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: lochinvar

