# golangci-lint v2 configuration for the MQTT bridge. CI pins the golangci-lint version in
# .github/workflows/validate.yml; run it locally with `golangci-lint run` from mqtt/.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        - hugeParam # Entity is passed by value on purpose; it is small and read-only
        - unnamedResult
        - rangeValCopy # ranging over the small, static entity list by value reads best
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over a few bytes per struct
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: unused-parameter
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: error-strings
        - name: receiver-naming
    sloglint:
      kv-only: true
      no-global: ""
      static-msg: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may use long table literals and dot-free comments.
      - path: _test\.go
        linters: [godot]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KB1RMA/lochinvar-native-modbus
