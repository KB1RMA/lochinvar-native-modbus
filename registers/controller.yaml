# Lochinvar boiler controller: Modbus RTU register map
#
# Source: reverse-engineered from the controller's built-in serial port (no MODB-I-O board).
# Every entry was observed with function 03 reads only. Nothing here is writable by design.
#
# confidence:
#   confirmed - matched a value read off the boiler display
#   likely    - behaves as described, partial or approximate display match
#   guess     - inferred from behaviour only
#   unknown   - changes or holds a value, meaning not identified
#
# mirrors: registers that hold the same value (equal in >=95 percent of log samples; the rest is
# sampling skew). Registers that track a value but differ (second thermistor, requested vs actual)
# get their own entry.
#
# references (Lochinvar documents, not in this repo; entries cite them as "service manual" and "WinPro"):
#   Knight Fire Tube Service Manual 100305279 Rev E and I&O Manual 100305277 Rev M (models 55-285, Series 100-121):
#     protections, parameter defaults and ranges, display screens, fault list.
#   SMART SYSTEM PC Program Instructions SM-PCPII Rev D: Lochinvar's WinPro program, which uses this same port.
#     Its screenshots list every parameter in order with short names (S1AUTOLIMHYS, FANIGN, ...), and its status
#     and fault log screens show what the control exports live.

source: controller-native
device:
  controller: SMART SYSTEM                         # Lochinvar's name for this control
  controller_firmware: "SIT 547_00 May 15 2018"   # decoded from registers 30-44; full string ends "938FT"
  platform: "938"                                  # Lochinvar's PC program for this control is "SMART SYSTEM 938"; FT = Fire Tube
  port: display "PC Connection" USB port           # the port Lochinvar's WinPro PC program uses
  tested_models: [KHB155N Series 100]              # Knight Fire Tube floor boiler, 155,000 BTU/hr, built 2023 (serial prefix 2332)

link:
  protocol: modbus-rtu
  baud: 19200
  data_bits: 8
  parity: none
  stop_bits: 1
  slave_id: 1
  read_function: 3          # holding registers; function 4 returns exception 1
  max_block: 50             # 50 register reads work; blocks touching unmapped addresses return exception 2
  electrical_level: usb     # FTDI FT232R inside the controller; older SMART SYSTEM displays had an RJ11 serial jack instead (untested)

# How raw 16-bit values become engineering units.
encodings:
  temp_f:
    description: Temperature in degrees F. Bit 15 is a flag; 0x8000 alone means no sensor.
    formula: "((raw & 0x7FFF) - 9468) / 25"
    unit: degF
    note: >-
      Exact for parameters and outdoor. Live water sensors matched the display within its truncation at idle
      (131.7 -> 131, 129.7 -> 129). The up-to-3 F gaps seen while firing match register values 10-20 s
      earlier, so they are most likely display lag, not a scale error. Not yet checked at steady high fire.
    no_sensor: 0x8000
    invalid: 0         # -378.7 F; seen once on r73 on the first ESPHome poll after a reboot, so treat as no reading
  u16:
    formula: "raw"
  u32:
    description: Two registers, high word at the lower address.
  signed16:
    formula: "raw if raw < 32768 else raw - 65536"
  ascii_swapped:
    description: ASCII text, two characters per register, characters swapped within each register.
  temp_delta_f:
    description: Temperature difference (hysteresis, offset, differential) in degrees F, no flag bit.
    formula: "raw / 25"
    unit: degF
    note: "250 = 10 F, 625 = 25 F, 1500 = 60 F; every value matched a manual default or WinPro screenshot"
  tenths_s:
    description: Time in 0.1 s. WinPro shows these as min'sec" with a maximum of 54'37" (32767).
    formula: "raw / 10"
    unit: s
  centivolts:
    formula: "raw / 100"
    unit: V

live:
  - {name: outlet_temp,    address: 62,   encoding: temp_f, confidence: likely, accuracy_f: 3, mirrors: [154]}
  - {name: outlet_temp_2,  address: 64,   encoding: temp_f, confidence: likely, note: "second outlet thermistor; within 0.7 F of r62. The service manual calls the pair S1a/S1b (two thermistors in one housing, the outlet / high limit sensor) and WinPro shows Outlet 1 and Outlet 2; the Outlet Temp Diff fault trips when they disagree. Published as Outlet Sensor Difference, |r62 - r64|"}
  - {name: inlet_temp,     address: 73,   encoding: temp_f, confidence: likely, accuracy_f: 3, mirrors: [155], note: "outlet - inlet matched display delta T allowing for lag; HA return pipe probe tracks it (sd about 1 F, reads 7 F low)"}
  - {name: exhaust_temp,   address: 63,   encoding: temp_f, confidence: likely, accuracy_f: 3, note: "falls fast as firing rate drops; reads 15-25 F below inlet at low fire, recheck against display"}
  - {name: exhaust_temp_2, address: 65,   encoding: temp_f, confidence: likely, note: "second flue thermistor; within 0.9 F of r63. Service manual S3a/S3b; WinPro shows Flue 2 as check / limit. Published as Flue Sensor Difference, |r63 - r65| (fault 'Flue sens diff')"}
  - {name: exhaust_temp_max, address: 156, encoding: temp_f, confidence: guess, note: "equals max(r63, r65) in 92 percent of samples"}
  - {name: outdoor_temp,   address: 75,   encoding: temp_f, confidence: confirmed, mirrors: [158]}
  - {name: tank_temp,      address: 157,  encoding: temp_f, confidence: guess, note: "always 0x8000 (no sensor; DHW is a zone here). Placed by order only: the 154-159 mirror block runs outlet, inlet, flue, ?, outdoor, ?, and the MODB-I-O sensor table runs tank, outdoor, system supply"}
  - {name: system_supply_temp, address: 159, encoding: temp_f, confidence: guess, note: "always 0x8000 (no sensor). Placed by order only, see tank_temp"}
  - {name: cabinet_temp,   address: 74,   encoding: temp_f, confidence: guess, note: "79-84 F, rises slowly while firing (corr 0.89 with r63 in session 2, 0.43 in session 1). Not a sensor in the MODB-I-O map; maybe board or cabinet air"}
  - {name: flame_signal,   address: 66,   encoding: u16, unit: nA, scale: 0.001, publish_unit: uA, confidence: confirmed, note: "12688 when display read 12.7 uA"}
  - {name: fan_speed,      address: 110,  encoding: u16, unit: rpm, confidence: confirmed}
  - {name: fan_speed_target, address: 89, encoding: u16, unit: rpm, confidence: likely, mirrors: [106, 149], note: "= 1700 + (r80/100 - 10) * 6500/90 within 50 rpm"}
  - {name: fan_speed_command, address: 107, encoding: u16, unit: rpm, confidence: likely, note: "same curve from r131; about 1 s ahead of r89; clamped to min fan 1700 at idle"}
  - {name: fan_drive,      address: 104,  encoding: u16, confidence: guess, note: "maybe fan PWM in 0.1 %: about 145 in prepurge, 604 at 85 % fire. Corr 0.98-0.998 with r110 and r80 while running, but the ratio to rpm is not constant. Redundant with fan_speed; do not publish"}
  - {name: fan_ramp_limit, address: 111,  encoding: u16, confidence: likely, note: "exactly 50 while running (r84 = 9), 250 in every other state, both sessions; r112 is always -r111 (signed16). These are parameters 1099-1102 (WinPro INCFAN/DECFAN 250, INCFAN_R/DECFAN_R 50 in run position). Constant per state; do not publish"}
  - {name: fan_tach_period, address: 108, encoding: u16, confidence: likely, note: "r108 * r110 = 3.75e6; inverse of fan speed, stale value at idle; do not publish"}
  - {name: firing_rate,    address: 80,   encoding: u16, unit: percent, scale: 0.01, confidence: likely, note: "8516 when display read 85 percent; display lags by roughly 10 s; 10 percent = min fan, 100 percent = max fan"}
  - {name: firing_rate_requested, address: 131, encoding: u16, unit: percent, scale: 0.01, confidence: likely, note: "always a multiple of 10; about 1 s ahead of r80"}
  - {name: setpoint_sh1_target, address: 142, encoding: temp_f, confidence: likely, note: "SH1 setpoint after outdoor reset: 172.1 at 41.3 F outdoor, 167.7 at 43.6 F; stops updating with no call, so it is published (SH1 Reset Target) only while r118 = 1"}
  - {name: setpoint_sh2_target, address: 143, encoding: temp_f, confidence: likely, note: "equals SH2 setpoint 125"}
  - {name: setpoint_sh3_target, address: 144, encoding: temp_f, confidence: guess, note: "equals SH3 setpoint 125; SH2/SH3 split unverified while both are 125"}
  - {name: setpoint_dhw_target, address: 145, encoding: temp_f, confidence: likely}
  - {name: active_target_temp, address: 146, encoding: temp_f, confidence: likely, mirrors: [147], note: "tracks r142 during the SH call; exactly 32.0 F (raw 43036) when there is no demand; dropped to 32 at the 10:02:17 shutdown; 161.2 F at 48 F outdoor in session 2. Backtest: 32.0 F if and only if r118 = 0 in every sample of both sessions, so 32.0 F means no setpoint (the MODB-I-O outlet setpoint uses the same convention); publish none, not 32. This is WinPro's dSP ('highest controlling set point that is active'), which its manual screenshot shows as 32 with no call for heat. Published as Target Temperature. r147 equalled r146 in 100 percent of samples; it may be the system setpoint (equal with no system sensor), untested"}

status:
  - {name: status_code,    address: 84,   encoding: u16, confidence: likely, codes: {4: standby, 6: prepurge, 7: ignition, 9: running, 10: post-purge}, note: "4 also during anti-cycle, clocked and set point met. 7 seen for 5-10 s between prepurge and running in both ESP32 cycles of session 4, starting with the flame signal; lockout codes not seen yet. If a lockout shows here, compare with the MODB-I-O lockout table (161-240, e.g. 233 no flame after ignition) in cwm12345/lochinvar-modbus enums.py; unverified on this controller. The display status list also has START (safety check before prepurge; maybe 5), SHUTDOWN and BLOCKED; the control locks out after 4 failed ignition tries"}
  - {name: phase_timer,    address: 85,   encoding: u16, unit: s, scale: 0.1, confidence: likely, note: "counts down; prepurge 17.7 s, post-purge 11.3-11.5 s"}
  - {name: minute_timer,   address: 87,   encoding: u16, unit: min, confidence: unknown, note: "1440 at standby, down 1 every ~61 s while firing, reset at standby"}
  - {name: heat_demand,    address: 118,  encoding: u16, confidence: likely, note: "1 during a call for heat (any zone)"}
  - {name: state_flags_a,  address: 138,  encoding: u16, confidence: likely, note: "4 during demand, 8 without"}
  - {name: state_flags_b,  address: 139,  encoding: u16, confidence: likely, note: "16 during demand, 0 without"}
  - {name: burner_request, address: 140,  encoding: u16, confidence: likely, note: "96 when the burner is wanted (goes 96 one second before prepurge), 112 when not, including demand present but held off (clocked / set point met)"}
  - {name: state_flags_d,  address: 136,  encoding: u16, confidence: unknown, note: "8 while firing, 0 at demand end (10:02:17)"}
  - {name: blower_flags,   address: [105, 128], encoding: u16, confidence: likely, note: "1 from prepurge start to post-purge end"}
  - {name: igniter,        address: 129,  encoding: u16, confidence: guess, note: "1 from the last second of prepurge; link dies just after"}
  - {name: gas_valve,      address: 115,  encoding: u16, confidence: guess, note: "1 at ignition with the first flame signal, 0 one second after flame-out"}
  - {name: burner_running, address: [127, 130], encoding: u16, confidence: likely, note: "1 exactly when r84 = 9 (100 percent of samples, both sessions); off at flame-out. Not a separate flame input: flame signal r66 rose at 11:31:44 in prepurge with r127 still 0. Adds nothing beyond r84; use r66 for flame"}
  - {name: burner_flags,   address: [116, 90], encoding: u16, confidence: guess, note: "1 while running; 116 off 9 s after flame-out, 90 at post-purge end"}
  - {name: safety_inputs,  address: [121, 122, 123, 124, 125], encoding: u16, confidence: guess, note: "1 in every sample, through prepurge and the blower; r120 and r126 always 0. The pattern matches the MODB-I-O idle input word 62 (flow, gas pressure, louver proving, air pressure, blocked drain on; auto-reset high limit off), which would make r121-r125 those five switches in that order and r126 the high limit. Untested: nothing ever changed. A tripped switch or lockout would settle it. WinPro lists the inputs as louver, flow/LWCO, gas pressure, air switch, drain switch, so that order is just as likely"}
  - {name: relay_load_analog, address: 67, encoding: u16, confidence: unknown, note: "1512 whenever the pump is on (100 percent of 1512 samples), 1509 with it off; flickers between them from the second r135 drops until the pump stops. An analog reading nudged by relay load; meaning unknown, do not publish"}
  - {name: anti_cycle,     address: 137,  encoding: u16, confidence: likely, note: "1 from flame-out until the off-delay ends; cleared with the display leaving anti-cycle"}
  - {name: boiler_pump_output, address: 132, encoding: u16, unit: percent, scale: 0.01, confidence: likely, note: "commanded. 100 % from the start of demand until about 60 s after flame-out (post-pump), then 0. Display 'BLR Pump Out' read 99-100 % while this read 10000"}
  - {name: boiler_pump_output_tenths, address: 133, encoding: u16, unit: percent, scale: 0.1, confidence: likely, note: "same as r132 in 0.1 % (1000)"}
  - {name: boiler_pump_output_actual, address: 81, encoding: u16, unit: percent, scale: 0.01, confidence: likely, note: "ramps with r132 (3917, 1243, 6674 seen mid-ramp the second r132 switched), jitters 9994/10005 at 100 %; was mapped as firing_rate_max"}
  - {name: system_pump_speed, address: 134, encoding: u16, confidence: guess, note: "always 0, next to the boiler pump registers 132/133; display SYS PUMP SPEED read 0 percent. Placed by position only"}
  - {name: pump_flag_135, address: 135, encoding: u16, confidence: unknown, note: "1000 with demand, 0 about 30 s after flame-out. Not the system pump (display SYS PUMP SPEED 0 % while this read 1000)"}

