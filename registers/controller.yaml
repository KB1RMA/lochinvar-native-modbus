unmapped_regions:
  - {range: [1006, 1295], note: "Parameter block; partly labeled from the WinPro parameter tables. 1068-1121 follow WinPro's 'Table 4 - Lochinvar' in order (also gradient limiting 1088-1096, fan PID 1103-1105, flame current support 1106-1108, pump timers 1111-1113, DHW PID 1115-1117). 1272-1283 look like the ramp delay steps."}
  - {range: [1144, 1144], note: "5309, the installer menu password printed in the service manual. Never publish it."}
  - {range: [1316, 1384], note: "1316-1332 all 0 and 1335-1365 all 0xFFFF: probably the per-fault counters and an empty last-10-lockouts table from WinPro's fault log. Capture this block before and after a lockout."}
  - {range: [150, 150], note: "Candidate for WinPro's Derivative Outlet or Derivative Flue (rate of change shown on its status screen)."}
  - {range: [0, 255], note: "Not found yet: WinPro's 'Limitations' flags (outlet temp, delta T, flue temp, flame current low; never active in our captures), DHW pump, louver relay and system pump outputs, LOOP 1-3 temps from the optional MTLC board."}
  - {range: [72, 72], note: "Not a counter: read 3828 (= SH run hours) in the idle scan by coincidence, wanders 3553-3887 in the log."}
  - {range: [150, 151], note: "r150 signed, about +/-7, maybe a rate of change; r151 rises in steps while firing."}
  - {range: [172, 176], note: "Controller clock (20, 5, 18, hour, minute). Runs, but about 54 min slow and the date is wrong; do not use as a timestamp. The manual says it must be set after the power has been off over 4 h and never adjusts for DST; WinPro sets it on connect (a write, so we don't)."}
  - {range: [500, 502], note: "Small values 6, 11, 2"}
  - {range: [68, 77], note: "r68, r70, r77 always 0x8000 (no sensor): likely the live copies of the tank, system supply and DHW recirculation sensors (see tank_temp). r69 = 503, r71 = 0"}
