# Lochinvar boiler controller: Modbus RTU register map
#
# Source: reverse-engineered from the controller's built-in serial port (no MODB-I-O board).
# Every entry was observed with function 03 reads only. Nothing here is writable by design.
#
# confidence:
#   confirmed - matched a value read off the boiler display
#   likely    - behaves as described, partial or approximate display match
#   guess     - inferred from behaviour only
#   unknown   - changes or holds a value, meaning not identified

source: controller-native
device:
  controller_firmware: "SIT 547_00 May 15 2018"   # decoded from registers 30-44
  tested_models: []                                # TODO: add boiler model

link:
  protocol: modbus-rtu
  baud: 19200
  data_bits: 8
  parity: none
  stop_bits: 1
  slave_id: 1
  read_function: 3          # holding registers; function 4 returns exception 1
  max_block: 50             # 50 register reads work; blocks touching unmapped addresses return exception 2
  electrical_level: unknown # TODO: RS-232 / RS-485 / TTL; an FTDI FT232R adapter worked

# How raw 16-bit values become engineering units.
encodings:
  temp_f:
    description: Temperature in degrees F. Bit 15 is a flag; 0x8000 alone means no sensor.
    formula: "((raw & 0x7FFF) - 9468) / 25"
    unit: degF
    note: Exact for parameters and outdoor. Live water/flue sensors read up to ~3 F off versus the display.
    no_sensor: 0x8000
  u16:
    formula: "raw"
  u32:
    description: Two registers, high word at the lower address.
  signed16:
    formula: "raw if raw < 32768 else raw - 65536"
  ascii_swapped:
    description: ASCII text, two characters per register, characters swapped within each register.

live:
  - {name: outlet_temp,    address: 62,   encoding: temp_f, confidence: likely, accuracy_f: 3, mirrors: [64, 154]}
  - {name: inlet_temp,     address: 73,   encoding: temp_f, confidence: likely, accuracy_f: 3, mirrors: [155], note: "outlet - inlet matched display delta T; swapped with exhaust once during discovery"}
  - {name: exhaust_temp,   address: 63,   encoding: temp_f, confidence: likely, accuracy_f: 3, mirrors: [65, 156], note: "falls fast as firing rate drops"}
  - {name: outdoor_temp,   address: 75,   encoding: temp_f, confidence: confirmed, mirrors: [158]}
  - {name: flame_signal,   address: 66,   encoding: u16, unit: nA, scale: 0.001, publish_unit: uA, confidence: confirmed, note: "12688 when display read 12.7 uA"}
  - {name: fan_speed,      address: 110,  encoding: u16, unit: rpm, confidence: confirmed}
  - {name: fan_speed_target, address: 89, encoding: u16, unit: rpm, confidence: likely, mirrors: [106, 107, 149]}
  - {name: firing_rate,    address: 80,   encoding: u16, unit: percent, scale: 0.01, confidence: likely, mirrors: [131], note: "8516 when display read 85 percent; display lags by roughly 10 s"}
  - {name: firing_rate_max, address: 81,  encoding: u16, unit: percent, scale: 0.01, confidence: guess, note: "about 100.00 percent; r132 is not a mirror (drops to 0 with no demand, session 2)"}
  - {name: setpoint_sh2_live, address: 143, encoding: temp_f, confidence: likely, mirrors: [144], note: "copy of SH2/SH3 setpoint"}
  - {name: setpoint_dhw_live, address: 145, encoding: temp_f, confidence: likely}

status:
  - {name: status_code,    address: 84,   encoding: u16, confidence: likely, note: "4 standby (also during anti-cycle), 6 prepurge, 9 running, 10 post-purge; ignition codes not seen yet"}
  - {name: phase_timer,    address: 85,   encoding: u16, unit: s, scale: 0.1, confidence: likely, note: "counts down; prepurge 17.7 s, post-purge 11.5 s"}
  - {name: anti_cycle,     address: 137,  encoding: u16, confidence: likely, note: "1 from flame-out until the off-delay ends; cleared with the display leaving anti-cycle"}
  - {name: heat_demand,    address: 118,  encoding: u16, confidence: likely, note: "1 during a call for heat"}
  - {name: active_target_temp, address: 146, encoding: temp_f, confidence: likely, mirrors: [147], note: "161.2 F during demand (outdoor reset?), 32 F with no demand"}
  - {name: state_flags_a,  address: 138,  encoding: u16, confidence: likely, note: "4 during demand, 8 without"}
  - {name: state_flags_b,  address: 139,  encoding: u16, confidence: likely, note: "16 during demand, 0 without"}
  - {name: burner_request, address: 140,  encoding: u16, confidence: likely, note: "96 when the burner is wanted (goes 96 one second before prepurge), 112 when not, including demand present but held off (clocked / set point met)"}
  - {name: boiler_pump_output, address: 132, encoding: u16, unit: percent, scale: 0.01, confidence: likely, mirrors: [133], note: "r133 holds the same in 0.1 % (1000). 100 % from the start of demand until about 60 s after flame-out (post-pump), then 0. Display 'BLR Pump Out' read 99-100 % while this read 10000"}
  - {name: pump_flag_135, address: 135, encoding: u16, confidence: unknown, note: "1000 with demand, 0 about 30 s after flame-out. Not the system pump (display SYS PUMP SPEED 0 % while this read 1000)"}
  - {name: blower_flags,   address: [105, 128], encoding: u16, confidence: likely, note: "1 from prepurge start to post-purge end"}
  - {name: igniter,        address: 129,  encoding: u16, confidence: guess, note: "1 from the last second of prepurge; link dies just after"}
  - {name: gas_valve,      address: 115,  encoding: u16, confidence: guess, note: "1 at ignition with the first flame signal, 0 one second after flame-out"}
  - {name: burner_flags,   address: [116, 127, 130, 90], encoding: u16, confidence: guess, note: "1 while running; 127/130 off at flame-out, 116 +9 s, 90 at post-purge end"}
  - {name: minute_timer,   address: 87,   encoding: u16, unit: min, confidence: unknown, note: "1440 at standby, counts down ~1/min while running"}

counters:
  - {name: power_on_hours,    address: 1302, words: 2, encoding: u32, unit: h,     confidence: confirmed}
  - {name: ignition_attempts, address: 1304, words: 2, encoding: u32,              confidence: confirmed}
  - {name: ignitions,         address: 1306, words: 2, encoding: u32,              confidence: confirmed}
  - {name: sh_run_time,       address: 1308, words: 2, encoding: u32, unit: h,     confidence: confirmed}
  - {name: counter_1310,      address: 1310, words: 2, encoding: u32,              confidence: unknown, note: "value 2055 at 10:15"}
  - {name: sh_cycles,         address: 1312, words: 2, encoding: u32,              confidence: confirmed}
  - {name: dhw_cycles,        address: 1314, words: 2, encoding: u32,              confidence: guess, note: "0 and DHW cycles on display was 0"}

settings:
  - {name: setpoint_dhw,     address: 1286, encoding: temp_f, confidence: confirmed}
  - {name: setpoint_sh1,     address: 1287, encoding: temp_f, confidence: confirmed}
  - {name: setpoint_sh2,     address: 1288, encoding: temp_f, confidence: confirmed}
  - {name: setpoint_sh3,     address: 1289, encoding: temp_f, confidence: confirmed}
  - {name: high_limit_auto_reset,   address: 1291, encoding: temp_f, confidence: confirmed}
  - {name: high_limit_manual_reset, address: [1292, 1293], encoding: temp_f, confidence: confirmed, note: "two identical copies"}
  - {name: firing_rate_min_param, address: [1097, 1146], encoding: u16, unit: percent, scale: 0.01, confidence: guess, note: "1700; live regs 114 holds the same"}
  - {name: firing_rate_max_param, address: [1098, 1150], encoding: u16, unit: percent, scale: 0.01, confidence: guess, note: "8200; live regs 113 holds the same"}

info:
  - {name: firmware_string, address: 30, words: 15, encoding: ascii_swapped, confidence: confirmed}

unmapped_regions:
  - {range: [1006, 1295], note: "Parameter block; mostly unlabeled. Includes temp_f values, percent values, timers and what looks like a weekly schedule at 1223-1250 (steps of 1440, minutes)."}
  - {range: [500, 502], note: "Small values 6, 11, 2"}
  - {range: [956, 1005], note: "exception 2 (illegal address)"}
  - {range: [1406, 2047], note: "mostly exception 2"}
